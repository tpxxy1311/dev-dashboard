# docker-compose.yml
services:
  db:
    image: postgres:17-alpine
    container_name: dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dashboard
    ports:
      - '5433:5432'
    volumes:
      - dashboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dashboard-data: